# Git hooks. pre-commit fixes and codegens staged files only (fast); pre-push
# checks what the branch changes, plus the whole-tree gates that fit a small
# host: format check and typecheck. CI runs every whole-tree check: type-aware
# lint, dead code, and the full test suite.

pre-commit:
  piped: true
  jobs:
    - name: oxlint --fix
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}'
      run: node_modules/.bin/oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc,md,css,yml,yaml,html}'
      run: node_modules/.bin/oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: format-codemod
      glob: '*.{ts,tsx}'
      run: node_modules/.bin/format-codemod --quiet {staged_files}
      stage_fixed: true
    - name: codegen:styles
      glob: '{apps,services,contracts,libs,infra}/**/*.{ts,tsx}'
      run: bun run codegen:styles
    - name: graphql-format
      glob: '**/*.graphql'
      run: bun run format
      stage_fixed: true
    # last so it scans what the fixers above re-staged; needs the gitleaks
    # binary on PATH (mise: `mise use -g gitleaks`)
    - name: gitleaks
      run: gitleaks git --pre-commit --staged --redact --no-banner

commit-msg:
  jobs:
    - name: commitlint
      run: node_modules/.bin/commitlint --edit {1}

# pre-push reads the ref lines git hands the hook: a push that only deletes
# refs skips the gate, since lefthook's own push-file detection diffs HEAD
# against its upstream and would otherwise run the whole gate on a deletion
pre-push:
  jobs:
    - name: push-gate
      use_stdin: true
      run: |
        seen=0
        deletions_only=1
        while read -r local_ref local_sha remote_ref remote_sha; do
          seen=1
          [ "$local_ref" = "(delete)" ] || deletions_only=0
        done
        if [ "$seen" = 1 ] && [ "$deletions_only" = 1 ]; then
          echo "ref deletion only; skipping the push gate"
          exit 0
        fi
        exec node_modules/.bin/lefthook run push-gate

push-gate:
  # one job at a time, to bound memory on a small host
  piped: true
  jobs:
    # lefthook skips a job whose files command fails and still exits 0, so a
    # missing base ref would pass the gate without linting or testing anything
    - name: base ref
      run:
        git rev-parse --verify --quiet origin/main > /dev/null || { echo "push-gate needs
        origin/main; run git fetch origin main"; exit 1; }
    - name: format:check
      run: bun run format:check
    # plain oxlint: the type-aware pass needs more memory than a 2 GiB host has
    - name: lint
      files: git diff --name-only --diff-filter=ACMR origin/main...HEAD
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}'
      run: node_modules/.bin/oxlint --no-error-on-unmatched-pattern {files}
    # one project and one checker at a time: tsc's default parallel checkers
    # push the web app's typecheck to about 1.5 GiB, one checker to about 0.8
    - name: typecheck
      run:
        node_modules/.bin/turbo run typecheck --concurrency=1 --output-logs=errors-only --
        --checkers 1
    # tests import uncommitted generated modules (panda's styled-system, router
    # typegen), so they are generated first. lefthook drops deleted paths from
    # {files}, so git lists them and a deleted module's sibling test still runs
    - name: test
      run:
        node_modules/.bin/turbo run codegen typegen --output-logs=errors-only && bun
        scripts/src/bin/test-related.ts $(git diff --name-only --diff-filter=ACMRD
        origin/main...HEAD)
