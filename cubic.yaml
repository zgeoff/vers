# yaml-language-server: $schema=https://cubic.dev/schema/cubic-repository-config.schema.json
version: 1

reviews:
  enabled: true
  sensitivity: high
  incremental_commits: false
  check_drafts: false
  resolve_threads_when_addressed: true
  auto_approve_behavior: disabled
  ultrareview: manual
  custom_instructions: |
    Focus exclusively on correctness: logic bugs, race conditions, data
    integrity, broken invariants, security flaws, and error-handling gaps.
    Do not comment on style, naming, formatting, or repo conventions —
    oxlint and a separate conventions reviewer own that lane. Prefer a few
    high-confidence findings over broad coverage.
  ignore:
    files:
      - bun.lock
      - libs/data/db/src/schema.generated.ts

pr_descriptions:
  generate: false

issues:
  fix_with_cubic_buttons: false
  pr_comment_fixes: false
