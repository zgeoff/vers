name: vers-infra
runtime:
  name: nodejs
  options:
    typescript: false
description:
  Cloudflare DNS for versidle.com and Axiom alerting, with Pulumi state held in Cloudflare R2.
packages:
  axiom:
    source: terraform-provider
    version: 1.2.0
    parameters:
      - axiomhq/axiom
      - 1.6.2
  neon:
    source: terraform-provider
    version: 1.2.0
    parameters:
      - kislerdm/neon
      - 0.13.0
