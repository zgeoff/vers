name: Main

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      affected-projects: ${{ steps.record-affected-projects.outputs.affected-projects }}
    env:
      TURBO_SCM_BASE: ${{ github.event.before }}
      # CI never commits, but skip hook install/execution regardless
      LEFTHOOK: 0
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Dotenv
        run: |
          echo "${{ secrets.DOTENV_APP_WEB_DEV }}" > projects/app-web/.env.development.local
          echo "${{ secrets.DOTENV_APP_WEB_E2E }}" > projects/app-web-e2e/.env

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Check AGENTS.md Drift
        run: |
          bun run build:agents
          git diff --exit-code AGENTS.md agents/ scripts/build-agents-md.sh

      - name: Setup Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Setup Docker image cache
        uses: ScribeMD/docker-cache@fb28c93772363301b8d0a6072ce850224b73f74e # 0.5.0
        id: docker-cache
        with:
          key: docker-${{ runner.os }}-${{ github.sha }}

      - name: Boundaries
        run: bun run boundaries

      - name: Generate Types
        run: bun run codegen:types

      - name: Generate Styles
        run: bun run codegen:styles

      - name: Check Formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Unit Tests
        run: |
          bun run pg:test-container:start
          bun run test

      - name: Install E2E browsers
        run: bun run playwright install --with-deps --only-shell chromium

      - name: E2E Tests
        id: e2e
        run: bunx turbo run e2e --affected

      - name: Upload Videos Of Failed E2E
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # gate on the e2e step so an earlier failure doesn't upload an empty artifact
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        with:
          name: playwright-results
          include-hidden-files: true
          path: projects/app-web-e2e/.test-results

      - name: Record Affected Projects
        id: record-affected-projects
        # runs even when e2e fails so a flaky suite can't skip the image builds
        # below (which validate every affected Dockerfile)
        if: ${{ !cancelled() }}
        run: |
          # names are <>-wrapped so the contains() gates can't substring-match
          affected="$(bunx turbo run build --affected --dry=json | jq -r '.packages[] | "<\(.)>"')"
          echo "${affected}"
          delimiter="$(openssl rand -hex 8)"
          echo "affected-projects<<${delimiter}" >> "${GITHUB_OUTPUT}"
          echo "${affected}" >> "${GITHUB_OUTPUT}"
          echo "${delimiter}" >> "${GITHUB_OUTPUT}"

      - name: Build Avatar Service Image
        if:
          ${{ !cancelled() && contains(steps.record-affected-projects.outputs.affected-projects,
          '<@vers/service-avatar>') }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: projects/service-avatar/Dockerfile
          tags: vers/service-avatar:latest
          push: false

      - name: Build Session Service Image
        if:
          ${{ !cancelled() && contains(steps.record-affected-projects.outputs.affected-projects,
          '<@vers/service-session>') }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: projects/service-session/Dockerfile
          tags: vers/service-session:latest
          push: false

      - name: Build User Service Image
        if:
          ${{ !cancelled() && contains(steps.record-affected-projects.outputs.affected-projects,
          '<@vers/service-user>') }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: projects/service-user/Dockerfile
          tags: vers/service-user:latest
          push: false

      - name: Build Verification Service Image
        if:
          ${{ !cancelled() && contains(steps.record-affected-projects.outputs.affected-projects,
          '<@vers/service-verification>') }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: projects/service-verification/Dockerfile
          tags: vers/service-verification:latest
          push: false

      - name: Build Web App Image
        if:
          ${{ !cancelled() && contains(steps.record-affected-projects.outputs.affected-projects,
          '<@vers/web>') }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: projects/app-web/Dockerfile
          tags: vers/app-web:latest
          push: false
