name: Main

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

# Concurrency is per-job, not per-workflow: a workflow-level cancel-in-progress
# kills flyctl mid-bluegreen rollout, stranding the green machines and failing
# every later deploy with "found multiple image versions". Checks stay
# cancellable (a newer push supersedes them); deploy jobs queue instead.
jobs:
  checks:
    runs-on: ubuntu-latest
    # a hung step (a script that never exits, a wedged container) must fail the
    # run, not burn runner hours — the suite's worst observed run is ~4 minutes
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-checks-${{ github.ref }}
      cancel-in-progress: true
    env:
      TURBO_SCM_BASE: ${{ github.event.before }}
      # CI never commits, but skip hook install/execution regardless
      LEFTHOOK: 0
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Dotenv
        env:
          DOTENV_APP_WEB_DEV: ${{ secrets.DOTENV_APP_WEB_DEV }}
          DOTENV_APP_WEB_E2E: ${{ secrets.DOTENV_APP_WEB_E2E }}
        run: |
          printf '%s\n' "$DOTENV_APP_WEB_DEV" > apps/web/.env.development.local
          printf '%s\n' "$DOTENV_APP_WEB_E2E" > apps/web-e2e/.env

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Check AGENTS.md Drift
        run: |
          bun run build:agents
          git diff --exit-code AGENTS.md agents/ scripts/build-agents-md.sh

      - name: Setup Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Boundaries
        run: bun run boundaries

      - name: Generate Types
        run: bun run codegen:types

      - name: Generate Styles
        run: bun run codegen:styles

      - name: Dead Code
        run: bun run deadcode

      - name: Check Formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Unit Tests
        run: |
          bun run pg:test-container:start
          bun run test

      - name: Install E2E browsers
        run: bun run playwright install --with-deps --only-shell chromium

      - name: E2E Tests
        id: e2e
        run: node_modules/.bin/turbo run e2e --affected

      - name: Upload Videos Of Failed E2E
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # gate on the e2e step so an earlier failure doesn't upload an empty artifact
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        with:
          name: playwright-results
          include-hidden-files: true
          path: apps/web-e2e/.test-results

  migrate:
    name: Migrate database
    needs: checks
    # migrations are a deploy action, not a check: they run exactly once per
    # green push — several services share the one database, so they never run
    # per-service — and, like rollouts, are never cancelled mid-run; a newer
    # push queues behind them. Idempotent: kysely-ctl no-ops when up to date.
    if: ${{ needs.checks.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: ${{ github.workflow }}-migrate
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run --cwd libs/data/db db:migrate

  deploy:
    name: Deploy
    needs: [checks, migrate]
    # deploy only a fully green build, after the shared schema is current. Each
    # leg self-gates inside the deploy CLI: it compares HEAD against the GIT_SHA
    # stamped on the app's machines, so a deploy skipped by an earlier failure
    # or cancellation stays "stale" and ships on the next push instead of being
    # lost with the push delta.
    if: ${{ needs.checks.result == 'success' && needs.migrate.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    # worst observed leg (app-web remote build + bluegreen cutover) is ~5
    # minutes; 3× headroom for builder variance without holding the queue
    timeout-minutes: 15
    # never cancel a rollout mid-flight; a newer run's deploy waits its turn
    concurrency:
      group: ${{ github.workflow }}-deploy-${{ matrix.app }}
      cancel-in-progress: false
    strategy:
      # each app is independent — one rollout failing must not abandon the others
      fail-fast: false
      matrix:
        app:
          - vers-service-avatar
          - vers-service-session
          - vers-service-user
          - vers-service-verification
          - vers-app-web
          - vers-bugsink
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # staleness runs turbo/git against each app's deployed SHA, which can
          # be many pushes old — the CLI needs full history
          fetch-depth: 0

      # The CLI deploys via Fly's remote builder: the image builds and pushes
      # inside Fly's network, avoiding a GitHub-runner-to-registry.fly.io blob
      # upload, which 502s on the large compiled-binary layers. Each app's
      # strategy (per fly.toml) gates cutover on the /health check, so a machine
      # that fails to boot blocks the release.
      #
      # syd host capacity is intermittently tight: a rollout that can't reserve a
      # machine fails with "insufficient resources / could not reserve resource"
      # and Fly rolls it back cleanly — re-run the failed job.
      #
      # app-web's image build bakes the browser DSN into the client bundle and
      # uploads source maps to the error tracker; both no-op when the token/DSN
      # aren't configured (the CLI forwards build args only when set).
      - name: Deploy ${{ matrix.app }}
        uses: ./.github/actions/fly-deploy
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        with:
          args: deploy --app ${{ matrix.app }}
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  verify-fleet:
    name: Verify fleet
    needs: [checks, deploy]
    # the deploy gate: every app in the manifest must be online and current, on
    # every green main push — even when every deploy leg skipped. This is what
    # catches a silently-missing deploy (an app at zero machines, or a fleet
    # still running code from before a cancelled rollout) and fails the run.
    if: ${{ !cancelled() && needs.checks.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    # six fleet reads plus probe retries fit in ~3 minutes at worst
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-verify-fleet
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Verify fleet
        uses: ./.github/actions/fly-deploy
        with:
          args: verify
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  alert:
    name: Alert on failure
    needs: [checks, migrate, deploy, verify-fleet]
    # a red main pipeline pages the team channel: agent-driven pushes mean
    # nobody is necessarily watching the Actions tab, and a failed deploy or
    # fleet verification left unnoticed is exactly how version skew lingers
    if: ${{ !cancelled() && contains(join(needs.*.result, ','), 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Send Discord alert
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: >-
            checks=${{ needs.checks.result }}, migrate=${{ needs.migrate.result }}, deploy=${{
            needs.deploy.result }}, verify-fleet=${{ needs.verify-fleet.result }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "DISCORD_WEBHOOK_URL not configured; skipping alert"
            exit 0
          fi
          subject="$(printf '%s' "${COMMIT_MSG}" | head -n 1)"
          payload="$(jq -n \
            --arg title "main pipeline failed: ${subject}" \
            --arg url "${RUN_URL}" \
            --arg desc "${FAILED}" \
            '{embeds: [{title: $title, url: $url, description: $desc, color: 15548997}]}')"
          curl -fsS -H 'content-type: application/json' -d "${payload}" "${WEBHOOK_URL}"
