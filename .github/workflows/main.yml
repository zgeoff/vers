name: Main

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

# Concurrency is per-job, not per-workflow: a workflow-level cancel-in-progress
# kills flyctl mid-bluegreen rollout, stranding the green machines and failing
# every later deploy with "found multiple image versions". Checks stay
# cancellable (a newer push supersedes them); deploy jobs queue instead.
jobs:
  checks:
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-checks-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      affected-projects: ${{ steps.record-affected-projects.outputs.affected-projects }}
    env:
      TURBO_SCM_BASE: ${{ github.event.before }}
      # CI never commits, but skip hook install/execution regardless
      LEFTHOOK: 0
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Dotenv
        env:
          DOTENV_APP_WEB_DEV: ${{ secrets.DOTENV_APP_WEB_DEV }}
          DOTENV_APP_WEB_E2E: ${{ secrets.DOTENV_APP_WEB_E2E }}
        run: |
          printf '%s\n' "$DOTENV_APP_WEB_DEV" > apps/web/.env.development.local
          printf '%s\n' "$DOTENV_APP_WEB_E2E" > apps/web-e2e/.env

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Check AGENTS.md Drift
        run: |
          bun run build:agents
          git diff --exit-code AGENTS.md agents/ scripts/build-agents-md.sh

      - name: Setup Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Boundaries
        run: bun run boundaries

      - name: Generate Types
        run: bun run codegen:types

      - name: Generate Styles
        run: bun run codegen:styles

      - name: Dead Code
        run: bun run deadcode

      - name: Check Formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Unit Tests
        run: |
          bun run pg:test-container:start
          bun run test

      - name: Install E2E browsers
        run: bun run playwright install --with-deps --only-shell chromium

      - name: E2E Tests
        id: e2e
        run: node_modules/.bin/turbo run e2e --affected

      - name: Upload Videos Of Failed E2E
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        # gate on the e2e step so an earlier failure doesn't upload an empty artifact
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        with:
          name: playwright-results
          include-hidden-files: true
          path: apps/web-e2e/.test-results

      - name: Run Database Migrations
        # only on a fully green run, and exactly once per push — several
        # services share the one database, so migrations never run
        # per-service. Idempotent: kysely-ctl no-ops when up to date.
        # The deploy job orders after this via `needs: checks`.
        if: ${{ success() }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run --cwd libs/data/db db:migrate

      - name: Record Affected Projects
        id: record-affected-projects
        # only a green run deploys; this feeds the deploy matrix's per-app gate
        if: ${{ success() }}
        run: |
          # names are <>-wrapped so the contains() gates can't substring-match
          affected="$(node_modules/.bin/turbo run build --affected --dry=json | jq -r '.packages[] | "<\(.)>"')"
          echo "${affected}"
          delimiter="$(openssl rand -hex 8)"
          echo "affected-projects<<${delimiter}" >> "${GITHUB_OUTPUT}"
          echo "${affected}" >> "${GITHUB_OUTPUT}"
          echo "${delimiter}" >> "${GITHUB_OUTPUT}"

  deploy:
    name: Deploy
    needs: checks
    # deploy only a fully green build; each leg self-gates on being affected. Runs
    # after `checks`, so the migration step there has already applied to Neon.
    if: ${{ needs.checks.result == 'success' }}
    runs-on: ubuntu-latest
    # never cancel a rollout mid-flight; a newer run's deploy waits its turn
    concurrency:
      group: ${{ github.workflow }}-deploy-${{ matrix.app }}
      cancel-in-progress: false
    strategy:
      # each app is independent — one rollout failing must not abandon the others
      fail-fast: false
      matrix:
        include:
          - app: vers-service-avatar
            pkg: '@vers/service-avatar'
            dir: services/avatar
          - app: vers-service-session
            pkg: '@vers/service-session'
            dir: services/session
          - app: vers-service-user
            pkg: '@vers/service-user'
            dir: services/user
          - app: vers-service-verification
            pkg: '@vers/service-verification'
            dir: services/verification
          - app: vers-app-web
            pkg: '@vers/web'
            dir: apps/web
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@dfdfedc86b296f5e5384f755a18bf400409a15d0 # v1.4

      # Fly's remote builder builds the image and pushes it inside Fly's network —
      # avoiding a GitHub-runner-to-registry.fly.io blob upload, which 502s on the
      # large compiled-binary layers. Each app's strategy (per fly.toml) gates cutover
      # on the /health check, so a machine that fails to boot blocks the release.
      #
      # syd host capacity is intermittently tight: a rollout that can't reserve a
      # machine fails with "insufficient resources / could not reserve resource" and
      # Fly rolls it back cleanly — re-run the failed job.
      #
      # app-web's image build bakes the browser DSN into the client bundle and uploads
      # source maps to the error tracker; both no-op when the token/DSN aren't configured.
      - name: Deploy ${{ matrix.app }}
        if: ${{ contains(needs.checks.outputs.affected-projects, format('<{0}>', matrix.pkg)) }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
        run: |
          build_args=""
          if [ "${{ matrix.app }}" = "vers-app-web" ] && [ -n "${SENTRY_AUTH_TOKEN}" ]; then
            build_args="--build-arg SENTRY_AUTH_TOKEN=${SENTRY_AUTH_TOKEN} --build-arg VITE_SENTRY_DSN=${VITE_SENTRY_DSN}"
          fi
          flyctl deploy --remote-only ${build_args} \
            --config ${{ matrix.dir }}/fly.toml \
            --dockerfile ${{ matrix.dir }}/Dockerfile

      # private services can't be reached from CI — their rollout health gate is the
      # smoke test. app-web is public, so verify it end-to-end after cutover: /health
      # proves the app booted, then an anonymous call through the RPC proxy must come
      # back as the contract's typed UNAUTHORIZED ("defined": true distinguishes it
      # from a middleware 401 or a 500). That round-trip crosses app-web → flycast →
      # service-user, so it fails on zero-machine services, key drift, and audience
      # drift — none of which /health can see.
      - name: Smoke check app-web
        if:
          ${{ matrix.app == 'vers-app-web' && contains(needs.checks.outputs.affected-projects,
          '<@vers/web>') }}
        run: |
          for attempt in $(seq 1 10); do
            code="$(curl -fsS -o /dev/null -w '%{http_code}' https://vers-app-web.fly.dev/health || true)"
            if [ "${code}" = "200" ]; then
              echo "app-web healthy"
              break
            fi
            if [ "${attempt}" = "10" ]; then
              echo "app-web /health never returned 200 after deploy"
              exit 1
            fi
            echo "attempt ${attempt}: /health returned ${code:-no-response}"
            sleep 5
          done
          for attempt in $(seq 1 10); do
            body="$(curl -sS -X POST -H 'content-type: application/json' -d '{"json":{}}' \
              https://vers-app-web.fly.dev/api/rpc/user/getCurrentUser || true)"
            if jq -e '.json.defined == true and .json.code == "UNAUTHORIZED" and .json.data.reason == "missing-session"' \
              > /dev/null 2>&1 <<< "${body}"; then
              echo "rpc path healthy: typed UNAUTHORIZED round-tripped"
              exit 0
            fi
            echo "attempt ${attempt}: rpc probe returned ${body:-no-response}"
            sleep 5
          done
          echo "app-web rpc probe never returned the typed UNAUTHORIZED after deploy"
          exit 1

  deploy-bugsink:
    name: Deploy vers-bugsink
    needs: checks
    # the error tracker isn't a workspace package, so turbo's affected detection
    # can't see it — this leg self-gates on a diff of its config directory. It ships
    # the pinned stock image: no build, just a machine update.
    if: ${{ needs.checks.result == 'success' }}
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-deploy-vers-bugsink
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Detect config changes
        id: config-diff
        run: |
          changed="$(git diff --name-only '${{ github.event.before }}' HEAD -- apps/bugsink/)"
          if [ -n "${changed}" ]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Setup flyctl
        if: ${{ steps.config-diff.outputs.changed == 'true' }}
        uses: superfly/flyctl-actions/setup-flyctl@dfdfedc86b296f5e5384f755a18bf400409a15d0 # v1.4

      - name: Deploy vers-bugsink
        if: ${{ steps.config-diff.outputs.changed == 'true' }}
        run: flyctl deploy --config apps/bugsink/fly.toml
