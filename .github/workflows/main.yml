name: Main

on:
  push:
    branches:
      - main

permissions:
  actions: read
  contents: read

# Concurrency is per-job, not per-workflow: a workflow-level cancel-in-progress
# kills flyctl mid-bluegreen rollout, stranding the green machines and failing
# every later deploy with "found multiple image versions". Checks stay
# cancellable (a newer push supersedes them); deploy jobs queue instead.
jobs:
  checks:
    runs-on: ubuntu-latest
    # a hung step (a script that never exits, a wedged container) must fail the
    # run, not burn runner hours — the suite's worst observed run is ~4 minutes
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-checks-${{ github.ref }}
      cancel-in-progress: true
    env:
      TURBO_SCM_BASE: ${{ github.event.before }}
      # CI never commits, but skip hook install/execution regardless
      LEFTHOOK: 0
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Dotenv
        env:
          DOTENV_APP_WEB_DEV: ${{ secrets.DOTENV_APP_WEB_DEV }}
          DOTENV_APP_WEB_E2E: ${{ secrets.DOTENV_APP_WEB_E2E }}
        run: |
          printf '%s\n' "$DOTENV_APP_WEB_DEV" > apps/web/.env.development.local
          printf '%s\n' "$DOTENV_APP_WEB_E2E" > apps/web-e2e/.env

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Check AGENTS.md Drift
        run: |
          bun run build:agents
          git diff --exit-code AGENTS.md agents/ scripts/build-agents-md.sh

      - name: Setup Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Boundaries
        run: bun run boundaries

      # stale generated contracts fail here; the coverage leg catches a
      # required key missing from a service's dev env files or either
      # compose stack
      - name: Check Env Contracts
        run: |
          bun run env:contract:check
          bun run env:coverage

      - name: Generate Types
        run: bun run codegen:types

      - name: Generate Styles
        run: bun run codegen:styles

      - name: Dead Code
        run: bun run deadcode

      - name: Check Formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Unit Tests
        run: |
          bun run pg:test-container:start
          bun run test

      - name: Install E2E browsers
        run: bun run playwright install --with-deps --only-shell chromium

      - name: E2E Tests
        id: e2e
        run: node_modules/.bin/turbo run e2e --affected

      - name: Upload Videos Of Failed E2E
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # gate on the e2e step so an earlier failure doesn't upload an empty artifact
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        with:
          name: playwright-results
          include-hidden-files: true
          path: apps/web-e2e/.test-results

  migrate:
    name: Migrate database
    needs: checks
    # migrations are a deploy action, not a check: they run exactly once per
    # green push — several services share the one database, so they never run
    # per-service — and, like rollouts, are never cancelled mid-run; a newer
    # push queues behind them. Idempotent: kysely-ctl no-ops when up to date.
    if: ${{ needs.checks.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: ${{ github.workflow }}-migrate
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Database Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: bun run --cwd libs/data/db db:migrate

  manifest:
    name: Read deploy manifest
    needs: checks
    # the deploy matrix derives from deploy.config.ts, so adding an app to the
    # manifest is the whole change — a hand-maintained matrix drifts, and a
    # manifest app with no deploy leg is a guaranteed verify-fleet failure
    if: ${{ needs.checks.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: List manifest apps
        id: list
        run: echo "apps=$(bun scripts/src/bin/deploy.ts list)" >> "$GITHUB_OUTPUT"

  preflight:
    name: Check deploy env
    needs: checks
    # a required env key uncovered by an app's fly.toml [env], set secrets, or
    # baked build args fails the run before any image builds — boot-time
    # validation would otherwise report the gap as a crash loop after cutover
    if: ${{ needs.checks.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # pinned: 0.4.80's bluegreen health polling ignores configured check grace
      # periods and aborts the whole rollout on a single transient machine read
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.4.78

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Check required env against the fleet
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: bun scripts/src/bin/deploy.ts preflight

  build:
    name: Build
    needs: [checks, manifest, preflight]
    # build images for every stale app as soon as checks are green — the phase
    # has no fleet side effects, so it runs beside migrate rather than after
    # it. Each leg self-gates inside the deploy CLI: it compares HEAD against
    # the GIT_SHA stamped on the app's machines, so a build skipped by an
    # earlier failure or cancellation stays "stale" and ships on the next push.
    if:
      ${{ needs.checks.result == 'success' && needs.manifest.result == 'success' &&
      needs.preflight.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    # worst observed leg (app-web remote build) is ~4 minutes; headroom for
    # builder variance without holding the queue
    timeout-minutes: 15
    # one build per app at a time — a newer run's build overwrites the same
    # commit-derived tag only after the earlier one finishes with it
    concurrency:
      group: ${{ github.workflow }}-build-${{ matrix.app }}
      cancel-in-progress: false
    strategy:
      # each app is independent — one build failing must not abandon the others
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.manifest.outputs.apps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # staleness runs turbo/git against each app's deployed SHA, which can
          # be many pushes old — the CLI needs full history
          fetch-depth: 0
          # no later step needs authenticated git access
          persist-credentials: false

      # The image builds and pushes on Fly's remote builder (inside Fly's
      # network, avoiding a GitHub-runner-to-registry.fly.io blob upload, which
      # 502s on the large compiled-binary layers), tagged by commit SHA so the
      # cutover phase derives the same ref without anything travelling between
      # the jobs.
      #
      # app-web's image build bakes the browser DSN into the client bundle and
      # uploads source maps to the error tracker; both no-op when the token/DSN
      # aren't configured (the CLI forwards build args only when set).
      - name: Build ${{ matrix.app }}
        uses: ./.github/actions/fly-deploy
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
        with:
          args: build --app ${{ matrix.app }}
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  stack-e2e:
    name: Full-stack E2E
    needs: [checks, manifest, build]
    # the pre-cutover gate: journeys run against the exact images the cutover
    # is about to promote — every app's ref resolves to this commit's build
    # when stale or the newest recorded release otherwise, so the suite always
    # exercises the fleet main is about to become. A failed build leg fails
    # this job on the missing image instead of skipping it.
    if:
      ${{ !cancelled() && needs.checks.result == 'success' && needs.manifest.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    # image pulls plus stack boot plus journeys is ~6 minutes at worst
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # ref resolution runs turbo/git against each app's deployed SHA,
          # which can be many pushes old — the CLI needs full history
          fetch-depth: 0
          persist-credentials: false

      # pinned: 0.4.80's bluegreen health polling ignores configured check grace
      # periods and aborts the whole rollout on a single transient machine read
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
        with:
          version: 0.4.78

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Resolve deployable image refs
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          bun scripts/src/bin/deploy.ts images | jq -r \
            'to_entries[] | "IMAGE_\(.key | ascii_upcase | gsub("-";"_"))=\(.value)"' \
            >> "$GITHUB_ENV"

      - name: Authenticate Docker to the Fly registry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl auth docker

      # postgres first, migrated before any service boots — a service must
      # never observe the unmigrated schema, even transiently
      - name: Boot and migrate the stack database
        env:
          DATABASE_URL: postgresql://admin:password@localhost:5533/vers
        run: |
          docker compose -f apps/web-e2e/docker-compose.stack.yml up -d --quiet-pull --wait postgres resend-stub
          bun run --cwd libs/data/db db:migrate

      # the demo accounts every seeded-login spec signs in as, written straight to the migrated
      # schema before any service reads it
      - name: Seed the stack database
        env:
          DATABASE_URL: postgresql://admin:password@localhost:5533/vers
        run: bun run --cwd apps/web-e2e stack:seed

      - name: Boot the stack
        run: docker compose -f apps/web-e2e/docker-compose.stack.yml up -d --quiet-pull --wait

      - name: Install E2E browsers
        run: bun run playwright install --with-deps --only-shell chromium

      - name: Full-stack journeys
        id: journeys
        run: bun run --cwd apps/web-e2e e2e:stack

      - name: Dump stack logs on failure
        if: ${{ failure() }}
        run: docker compose -f apps/web-e2e/docker-compose.stack.yml logs --tail 100

      - name: Upload results of failed journeys
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        # gate on the journeys step so an earlier failure doesn't upload an empty artifact
        if: ${{ failure() && steps.journeys.outcome == 'failure' }}
        with:
          name: stack-playwright-results
          include-hidden-files: true
          path: apps/web-e2e/.stack-test-results

  deploy:
    name: Deploy
    needs: [checks, migrate, manifest, preflight, build, stack-e2e]
    # cut over after the shared schema is current and the full-stack suite
    # has passed against the images being promoted. The build job is an
    # ordering edge only — its matrix result never gates this job directly —
    # but any missing image surfaces as a stack-e2e failure, and that gate is
    # deliberately fleet-wide: a combined state that fails its journeys, or
    # can't even boot, ships for no app. Legs self-gate on staleness exactly
    # as the build phase does.
    if:
      ${{ !cancelled() && needs.checks.result == 'success' && needs.migrate.result == 'success' &&
      needs.manifest.result == 'success' && needs.preflight.result == 'success' &&
      needs.stack-e2e.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    # bluegreen cutover plus probes is ~3 minutes at worst; headroom without
    # holding the queue
    timeout-minutes: 15
    # never cancel a rollout mid-flight; a newer run's deploy waits its turn
    concurrency:
      group: ${{ github.workflow }}-deploy-${{ matrix.app }}
      cancel-in-progress: false
    strategy:
      # each app is independent — one rollout failing must not abandon the others
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.manifest.outputs.apps) }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # staleness runs turbo/git against each app's deployed SHA, which can
          # be many pushes old — the CLI needs full history
          fetch-depth: 0

      # The fleet cuts over to the ref the build phase pushed for this commit.
      # Each app's strategy (per fly.toml) gates cutover on the /health check,
      # so a machine that fails to boot blocks the release; a release that
      # boots but fails its post-deploy probes is rolled back to the app's
      # previous recorded release, with the leg left red to fix forward.
      #
      # syd host capacity is intermittently tight: a rollout that can't reserve a
      # machine fails with "insufficient resources / could not reserve resource"
      # and Fly rolls it back cleanly — re-run the failed job.
      - name: Deploy ${{ matrix.app }}
        uses: ./.github/actions/fly-deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SERVICE_AUTH_JWKS: ${{ vars.SERVICE_AUTH_JWKS }}
        with:
          args: cutover --app ${{ matrix.app }}
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  verify-fleet:
    name: Verify fleet
    needs: [checks, deploy]
    # the deploy gate: every app in the manifest must be online and current, on
    # every green main push — even when every deploy leg skipped. This is what
    # catches a silently-missing deploy (an app at zero machines, or a fleet
    # still running code from before a cancelled rollout) and fails the run.
    if: ${{ !cancelled() && needs.checks.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    # six fleet reads plus probe retries fit in ~3 minutes at worst
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-verify-fleet
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Verify fleet
        uses: ./.github/actions/fly-deploy
        with:
          args: verify
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

  alert:
    name: Alert on failure
    needs: [checks, migrate, manifest, build, stack-e2e, deploy, verify-fleet]
    # a red main pipeline pages the team channel: agent-driven pushes mean
    # nobody is necessarily watching the Actions tab, and a failed deploy or
    # fleet verification left unnoticed is exactly how version skew lingers
    if: ${{ !cancelled() && contains(join(needs.*.result, ','), 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Send Discord alert
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: >-
            checks=${{ needs.checks.result }}, migrate=${{ needs.migrate.result }}, manifest=${{
            needs.manifest.result }}, build=${{ needs.build.result }}, stack-e2e=${{
            needs.stack-e2e.result }}, deploy=${{ needs.deploy.result }}, verify-fleet=${{
            needs.verify-fleet.result }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "${WEBHOOK_URL}" ]; then
            echo "DISCORD_WEBHOOK_URL not configured; skipping alert"
            exit 0
          fi
          subject="$(printf '%s' "${COMMIT_MSG}" | head -n 1)"
          # Canonical alarms embed: [source] severity — what fired, one link to
          # the run, and the critical hue shared with the Axiom notifiers.
          payload="$(jq -n \
            --arg title "[CI] critical — main pipeline failed" \
            --arg url "${RUN_URL}" \
            --arg desc "${subject}" \
            --arg failed "${FAILED}" \
            '{embeds: [{title: $title, url: $url, description: $desc, color: 15026253, fields: [{name: "Failed jobs", value: $failed}]}]}')"
          curl -fsS -H 'content-type: application/json' -d "${payload}" "${WEBHOOK_URL}"
