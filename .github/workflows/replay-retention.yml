name: Replay retention sweep

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    name: Sweep expired sim versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # the alert step runs the repo's alert script, so Bun is ready before the sweep can fail
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Sweep
        uses: ./.github/actions/fly-deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        with:
          args: sweep-replay
          fly-api-token: ${{ secrets.FLY_API_TOKEN }}

      # a refused prune (unverified work still pinned to an expired version) or a failed sweep
      # alarms the channel, since nobody watches a scheduled run's Actions tab
      - name: Send Discord alert
        if: ${{ failure() }}
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALERT_TITLE: '[CI] critical — replay retention sweep run failed'
          ALERT_DESCRIPTION:
            'the run failed: a refused prune (unverified work pinned to an expired version), a sweep
            fault, or a step before it; open the run'
        run: bun run ci:discord-alert
