name: Dep Health

on:
  schedule:
    # Monday 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  # keep ANSI escapes out of the step summaries
  NO_COLOR: 1

jobs:
  # a red run starts the audit-fix workflow, which opens the fix pull request
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # audit reads bun.lock and the advisory registry directly - no install needed
      - name: Audit
        run: bun run audit

  outdated:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # every external version lives in the root catalog, so the root report covers the workspace
      - name: Outdated Report
        run: |
          bun outdated > outdated.txt
          cat outdated.txt
          {
            echo '## bun outdated'
            echo
            echo '```'
            cat outdated.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
