name: PR

on:
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # the action comments findings on the PR, which needs write on pull-requests
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The scan reads the pull request's commits, which the merge commit's history holds. A
      # positive fetch-depth fetches only the merge commit and its history, where 0 fetches every
      # branch and tag; 2147483647 is git's infinite depth, so the clone is not shallow. blob:none
      # fetches a file's contents only when git first reads them. A fetch that stalls fails the step
      # at its timeout, and the retry fetches again with time left in the job.
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        continue-on-error: true
        with:
          fetch-depth: 2147483647
          filter: blob:none

      - name: Retry checkout
        if: ${{ steps.checkout.outcome != 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          fetch-depth: 2147483647
          filter: blob:none

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # the action's hard-coded default (8.24.3) predates the root-level
          # [[allowlists]] syntax .gitleaks.toml relies on and silently ignores it
          GITLEAKS_VERSION: 8.30.1

  checks:
    runs-on: ubuntu-latest
    # a hung step (a script that never exits, a wedged container) must fail the
    # run, not burn runner hours
    timeout-minutes: 10
    env:
      # the merge commit's first parent is the base branch's tip it merges into
      TURBO_SCM_BASE: HEAD^1
      # CI never commits, but skip hook install/execution regardless
      LEFTHOOK: 0
    steps:
      # the affected-packages runs and the content digest diff the merge commit against its base
      # parent, HEAD^1: see the gitleaks job's Checkout for the depth, the filter and the retry
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        continue-on-error: true
        with:
          fetch-depth: 2147483647
          filter: blob:none

      - name: Retry checkout
        if: ${{ steps.checkout.outcome != 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          fetch-depth: 2147483647
          filter: blob:none

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.22.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Doc links
        run: bash .claude/skills/docs-writing/scripts/check-links.sh

      # Some READMEs and docs/ pages fail the shared length or prose rules, so this step reports
      # its findings without failing the run.
      - name: Doc length and prose
        continue-on-error: true
        run: bash .claude/skills/docs-writing/scripts/check-length.sh

      - name: Audit
        run: bun run audit

      - name: Dependency gates
        run: bun run deps:check

      - name: Setup Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Boundaries
        run: bun run boundaries

      # stale generated contracts fail here; the coverage leg catches a
      # required key missing from a service's dev env files or either
      # compose stack
      - name: Check Env Contracts
        run: |
          bun run env:contract:check
          bun run env:coverage

      # every op:// reference that .mcp.json, the workflows and infra/ read is listed by name in
      # secrets-manifest.json, and every listed one is still read
      - name: Check Secrets Manifest
        run: bun run secrets:check

      - name: Check Doc Paths
        run: bun run docs:check-paths

      # a change to item-gen, roll-crypto or worldmap-content fails here unless it ships as a new
      # content version, because a retained activity mints through the interpreter its version pins;
      # the base ref's recorded digests stay as they were
      - name: Check Content Digest
        run: bun run content:check-digest --base HEAD^1

      - name: Generate Types
        run: bun run codegen:types

      - name: Generate Styles
        run: bun run codegen:styles

      - name: Dead Code
        run: bun run deadcode

      - name: Check Formatting
        run: bun run format:check

      - name: Lint
        run: bun run lint

      # 4 turbo tasks on the 4-vCPU runner: on a full cache miss this measured 73 s against 71 s
      # at turbo's default 10. Each package keeps a plain bun test, because --parallel=1 isolates
      # every file and measured 157-190 s
      - name: Unit Tests
        run: |
          bun run pg:test-container:start
          bun run test --concurrency=4 -- --reporter=junit --reporter-outfile=test-report.junit.xml

      # a test over 5 s fails the run, whatever timeout the test sets
      - name: Slow Tests
        run: bun run test:check-slow

      - name: Build
        run: node_modules/.bin/turbo run build --affected

      # the web build is forced rather than --affected so the budget reads real chunk sizes on
      # every pull request; turbo restores it from cache when nothing changed
      - name: Bundle size
        run: |
          node_modules/.bin/turbo run build --filter=@vers/web
          bun run --cwd apps/web size

  size:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LEFTHOOK: 0
    # the action comments the size delta on the PR, which needs write on pull-requests
    permissions:
      contents: read
      pull-requests: write
    steps:
      # the size action fetches and checks out the base branch itself, so the job reads no history
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.22.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Setup Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # the action runs the script on the head, then checks out the base and runs `bun install`
      # and `bun run build` there before the script (skip_step covers the head only). A checkout
      # without the size:delta script (a base that predates the budget) yields an empty result set,
      # so the comment reads the whole head size as the delta; a checkout with it reports a build
      # or measurement failure as a failed job. The action re-splits the script on quotes, so it
      # stays free of inner quoting.
      - name: Size delta comment
        uses: andresz1/size-limit-action@94bc357df29c36c8f8d50ea497c3e225c3c95d1d # v1.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          package_manager: bun
          skip_step: build
          directory: apps/web
          script:
            bash -c "if grep -q size:delta package.json; then bun run size:delta; else echo []; fi"

  # turbo's affected-packages run counts no package changed by a workflow edit, so a change to the
  # workflows that run the suite runs every spec
  e2e-workflow-changes:
    permissions:
      contents: read
    uses: zgeoff/tools/.github/workflows/paths-changed.yml@bc5509064eaeb9af9feee3b7308104a0f3c28a01 # main
    with:
      paths: |
        .github/workflows/main.yml
        .github/workflows/pr.yml

  e2e:
    needs: e2e-workflow-changes
    if: ${{ !cancelled() }}
    # the renderer specs run one at a time and take most of the suite's time, so their two shards
    # and the other projects each get a runner; --no-deps drops the wait on the placeholder
    # project, which runs on its own runner
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: placeholder
            projects: --project=chromium --project=firefox --project=webkit
          - leg: renderer-1
            projects: --project=chromium-renderer --no-deps --shard=1/2
          - leg: renderer-2
            projects: --project=chromium-renderer --no-deps --shard=2/2
    name: e2e (${{ matrix.leg }})
    runs-on: ubuntu-latest
    # a hung step (a wedged webServer, a stuck browser) must fail the run, not
    # burn runner hours
    timeout-minutes: 10
    env:
      # the merge commit's first parent is the base branch's tip it merges into
      TURBO_SCM_BASE: HEAD^1
      # a failed gate leaves the output empty, and the suite then runs in full
      E2E_SCOPE: ${{ needs.e2e-workflow-changes.outputs.changed == 'false' && '--affected' || '' }}
      # CI never commits, but skip hook install/execution regardless
      LEFTHOOK: 0
    steps:
      # the affected-packages run diffs the merge commit against its base parent, HEAD^1: see the
      # gitleaks job's Checkout for the depth, the filter and the retry
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        continue-on-error: true
        with:
          fetch-depth: 2147483647
          filter: blob:none

      - name: Retry checkout
        if: ${{ steps.checkout.outcome != 'success' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          fetch-depth: 2147483647
          filter: blob:none

      - name: Setup Dotenv
        env:
          DOTENV_APP_WEB_DEV: ${{ secrets.DOTENV_APP_WEB_DEV }}
          DOTENV_APP_WEB_E2E: ${{ secrets.DOTENV_APP_WEB_E2E }}
        run: |
          printf '%s\n' "$DOTENV_APP_WEB_DEV" > apps/web/.env.development.local
          printf '%s\n' "$DOTENV_APP_WEB_E2E" > apps/web-e2e/.env

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.22.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      # scoped key so this job's saved cache never collides with the checks job's;
      # the prefix restore matches either job's most recent save
      - name: Setup Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-e2e-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-e2e-${{ runner.os }}-
            turbo-${{ runner.os }}-

      # the runner's Ubuntu mirror serves the browsers' system packages at a few hundred kB/s on
      # some runs, long enough to reach the job timeout, so apt keeps its downloads in a cache
      - name: Read browser package cache key
        id: browser-packages
        run:
          echo "key=e2e-apt-$ImageOS-$(node -p "require('@playwright/test/package.json').version")"
          >> "$GITHUB_OUTPUT"

      - name: Setup browser package cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/apt-archives
          key: ${{ steps.browser-packages.outputs.key }}-all

      - name: Install E2E browsers
        run: |
          mkdir -p ~/apt-archives/partial
          printf 'Dir::Cache::Archives "%s";\nAPT::Keep-Downloaded-Packages "true";\nAcquire::Retries "3";\n' ~/apt-archives \
            | sudo tee /etc/apt/apt.conf.d/90-browser-packages
          bun run playwright install --with-deps --only-shell chromium firefox webkit
          sudo chown -R "$USER" ~/apt-archives

      - name: E2E Tests
        id: e2e
        env:
          # the worker mints an activity start only under a bundled engine hash, and the mock
          # services the specs run against accept any hash
          VITE_SIM_ENGINE_HASH: e2e-mock-engine
          E2E_PROJECTS: ${{ matrix.projects }}
        # on CI turbo groups each task's log and prints it when the task ends, so a suite cut off at
        # the job limit printed nothing; streamed, the log shows each test as it finishes
        run: node_modules/.bin/turbo run e2e $E2E_SCOPE --log-order=stream -- $E2E_PROJECTS

      - name: Upload Videos Of Failed E2E
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        # gate on the e2e step so an earlier failure doesn't upload an empty artifact
        if: ${{ failure() && steps.e2e.outcome == 'failure' }}
        with:
          name: playwright-results-${{ matrix.leg }}
          include-hidden-files: true
          path: apps/web-e2e/.test-results

  # main builds the images only at deploy, on Fly's remote builder, so a change to an install
  # stage's inputs builds every server image here before it merges
  changes:
    permissions:
      contents: read
    uses: zgeoff/tools/.github/workflows/paths-changed.yml@bc5509064eaeb9af9feee3b7308104a0f3c28a01 # main
    with:
      paths: |
        apps/web/Dockerfile
        services/Dockerfile
        services/*/fly.toml
        .dockerignore
        package.json
        **/package.json
        bun.lock
        bunfig.toml
        patches/**
        .github/workflows/pr.yml

  images:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    # a hung build must fail the run, not burn runner hours
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build server images
        run: |
          set -euo pipefail
          echo "::group::apps/web"
          docker build --file apps/web/Dockerfile .
          echo "::endgroup::"
          for config in services/*/fly.toml; do
            service="$(basename "$(dirname "$config")")"
            echo "::group::services/$service"
            docker build --file services/Dockerfile --build-arg "SERVICE=$service" .
            echo "::endgroup::"
          done
