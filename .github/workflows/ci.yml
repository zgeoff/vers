name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    outputs:
      affected-projects: ${{ steps.record-affected-projects.outputs.affected-projects }}
    env:
      # a PR compares against the tracked local `main` below; a push to
      # main has nothing to diff against except the commit it replaced
      TURBO_SCM_BASE: ${{ github.event_name == 'push' && github.event.before || 'main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Dotenv
        run: |
          echo "${{ secrets.DOTENV_APP_WEB_DEV }}" > projects/app-web/.env.development.local
          echo "${{ secrets.DOTENV_APP_WEB_E2E }}" > projects/app-web-e2e/.env

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20.18.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Check AGENTS.md Drift
        run: |
          bun run build:agents
          git diff --exit-code AGENTS.md agents/ scripts/build-agents-md.sh

      - name: Track main branch
        run: git branch --track main origin/main
        if: ${{ github.event_name == 'pull_request' }}

      - name: Setup Turbo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Setup Docker image cache
        uses: ScribeMD/docker-cache@0.5.0
        id: docker-cache
        with:
          key: docker-${{ runner.os }}-${{ github.sha }}

      - name: Boundaries
        run: bun run boundaries

      - name: Generate Types
        run: bun run codegen:types

      - name: Generate Styles
        run: bun run codegen:styles

      - name: Check Formatting
        run: bun run format --check

      - name: Lint
        run: bun run lint

      - name: Unit Tests
        run: |
          bun run pg:test-container:start
          bun run test

      - name: Build
        if: ${{ github.ref_name != 'main' }}
        run: bunx turbo run build --affected

      - name: Install E2E browsers
        run: bun run playwright install --with-deps --only-shell chromium

      - name: E2E Tests
        run: bunx turbo run e2e --affected

      - name: Upload Videos Of Failed E2E
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          include-hidden-files: true
          path: projects/app-web-e2e/.test-results

      - name: Record Affected Projects
        id: record-affected-projects
        if: ${{ github.ref_name == 'main' }}
        run: |
          # each name is wrapped in <> so the contains() gates below can't substring-match (e.g. @vers/web vs @vers/web-e2e)
          affected="$(bunx turbo run build --affected --dry=json | jq -r '.packages[] | "<\(.)>"')"
          echo "${affected}"
          delimiter="$(openssl rand -hex 8)"
          echo "affected-projects<<${delimiter}" >> "${GITHUB_OUTPUT}"
          echo "${affected}" >> "${GITHUB_OUTPUT}"
          echo "${delimiter}" >> "${GITHUB_OUTPUT}"

      - name: Build db-postgres Image
        if: ${{ github.ref_name == 'main' &&
          (contains(steps.record-affected-projects.outputs.affected-projects, '<@vers/db-postgres>') ||
          contains(steps.record-affected-projects.outputs.affected-projects, '<@vers/postgres-schema>')) }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: projects/db-postgres/Dockerfile
          tags: vers/db-postgres:latest
          push: false

      - name: Build API Service Image
        if: ${{ github.ref_name == 'main' && contains(steps.record-affected-projects.outputs.affected-projects, '<@vers/service-api>') }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: projects/service-api/Dockerfile
          tags: vers/service-api:latest
          push: false

      - name: Build Avatar Service Image
        if: ${{ github.ref_name == 'main' && contains(steps.record-affected-projects.outputs.affected-projects, '<@vers/service-avatar>') }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: projects/service-avatar/Dockerfile
          tags: vers/service-avatar:latest
          push: false

      - name: Build Email Service Image
        if: ${{ github.ref_name == 'main' && contains(steps.record-affected-projects.outputs.affected-projects, '<@vers/service-email>') }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: projects/service-email/Dockerfile
          tags: vers/service-email:latest
          push: false

      - name: Build Session Service Image
        if: ${{ github.ref_name == 'main' && contains(steps.record-affected-projects.outputs.affected-projects, '<@vers/service-session>') }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: projects/service-session/Dockerfile
          tags: vers/service-session:latest
          push: false

      - name: Build User Service Image
        if: ${{ github.ref_name == 'main' && contains(steps.record-affected-projects.outputs.affected-projects, '<@vers/service-user>') }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: projects/service-user/Dockerfile
          tags: vers/service-user:latest
          push: false

      - name: Build Verification Service Image
        if: ${{ github.ref_name == 'main' && contains(steps.record-affected-projects.outputs.affected-projects, '<@vers/service-verification>') }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: projects/service-verification/Dockerfile
          tags: vers/service-verification:latest
          push: false

      - name: Build Web App Image
        if: ${{ github.ref_name == 'main' && contains(steps.record-affected-projects.outputs.affected-projects, '<@vers/web>') }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.18.0
        with:
          context: .
          file: projects/app-web/Dockerfile
          tags: vers/app-web:latest
          push: false
