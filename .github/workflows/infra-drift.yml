name: infra-drift

# Previews the prod stack of infra/. A pull request's run checks main for drift, which fails the
# job, and shows the pull request's planned change, which fails it only on an error. The weekly run
# checks main for drift, because console drift arrives with no commit. infra-deploy applies each
# merge.
on:
  pull_request:
    # the root manifest's catalog and the lockfile pin the program's Pulumi packages
    paths:
      - 'infra/**'
      - 'package.json'
      - 'bun.lock'
      - 'scripts/src/infra/**'
      - 'scripts/src/bin/infra-step.ts'
      - 'scripts/src/bin/pulumi-stack.ts'
      - '.github/workflows/infra-drift.yml'
  schedule:
    - cron: '17 19 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # fork PRs run without secrets, so the preview cannot authenticate — skip them
    if:
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name ==
      github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # a preview takes no lock on the stack's state, so one that runs beside infra-deploy's apply
    # reads a half-applied stack; every job that reads or writes the prod stack waits its turn here
    concurrency:
      group: infra-prod
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.22.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
        with:
          version: 2.34.1

      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: 3.273.0

      # main's tip when the job holds the queue, never the event's base: a queued run or a rerun
      # would preview an older program and report a deploy that landed since as drift
      - name: Check out main
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: base
          persist-credentials: false

      - name: Install main's dependencies
        if: github.event_name == 'pull_request'
        working-directory: base
        run: bun install --frozen-lockfile

      - name: Check main for drift
        if: github.event_name == 'pull_request'
        env:
          STEP: drift-before
          INFRA_PATH: base/infra
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: bun run ci:infra-step

      - name: Preview the change
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          STEP: change
          INFRA_PATH: infra
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: bun run ci:infra-step

      - name: Check for drift
        if: github.event_name != 'pull_request'
        env:
          STEP: drift
          INFRA_PATH: infra
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: bun run ci:infra-step

      - name: Report token rate limit
        if: always()
        continue-on-error: true
        run: op service-account ratelimit
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
