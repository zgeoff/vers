name: infra-drift

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra-drift.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-drift.yml'
  schedule:
    # weekly: console drift arrives with no commit, so no push can catch it
    - cron: '17 19 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# every trigger previews the same prod stack — one at a time
concurrency:
  group: infra-drift-prod
  cancel-in-progress: true

jobs:
  preview:
    # fork PRs run without secrets, so the preview cannot authenticate — skip them
    if:
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name ==
      github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.22.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
        with:
          version: 2.34.1

      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: 3.270.0

      # one op process resolves every reference in .env.example with one sign-in; an action that
      # spawns op per reference signs in once per secret, and 1Password throttled those bursts
      - name: Preview
        working-directory: infra
        # bash, unlike the default shell, sets pipefail, so the tee keeps the preview's exit code
        shell: bash
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: >-
          op run --env-file=.env.example -- sh -c
          'PULUMI_BACKEND_URL="s3://$R2_STATE_BUCKET?endpoint=$CLOUDFLARE_ACCOUNT_ID.r2.cloudflarestorage.com&region=auto&s3ForcePathStyle=true"
          pulumi preview --stack prod --refresh --diff --expect-no-changes --non-interactive --color
          never' 2>&1 | tee "$RUNNER_TEMP/preview.txt"

      - name: Summarize preview
        if: always()
        run: |
          {
            echo '## Pulumi preview (prod)'
            echo '```text'
            cat "$RUNNER_TEMP/preview.txt" 2>/dev/null || echo 'the preview step wrote no output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report token rate limit
        if: always()
        continue-on-error: true
        run: op service-account ratelimit
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
