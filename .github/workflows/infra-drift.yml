name: infra-drift

on:
  pull_request:
    paths:
      - 'infra/**'
      - 'scripts/src/infra/**'
      - 'scripts/src/bin/infra-preview.ts'
      - 'scripts/src/bin/infra-preview-summary.ts'
      - 'scripts/src/bin/pulumi-preview.ts'
      - '.github/workflows/infra-drift.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - 'scripts/src/infra/**'
      - 'scripts/src/bin/infra-preview.ts'
      - 'scripts/src/bin/infra-preview-summary.ts'
      - 'scripts/src/bin/pulumi-preview.ts'
      - '.github/workflows/infra-drift.yml'
  schedule:
    # weekly: console drift arrives with no commit, so no push can catch it
    - cron: '17 19 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# every trigger previews the same prod stack — one at a time
concurrency:
  group: infra-drift-prod
  cancel-in-progress: true

jobs:
  preview:
    # fork PRs run without secrets, so the preview cannot authenticate — skip them
    if:
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name ==
      github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.22.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
        with:
          version: 2.34.1

      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7.0.0
        with:
          pulumi-version: 3.272.0

      # one op process resolves every reference in infra/.env.example with one sign-in; an action
      # that spawns op per reference signs in once per secret, and 1Password throttled those bursts
      - name: Preview
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: bun run ci:infra-preview

      - name: Summarize preview
        if: always()
        run: bun run ci:infra-preview-summary

      - name: Report token rate limit
        if: always()
        continue-on-error: true
        run: op service-account ratelimit
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
