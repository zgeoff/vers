name: Fly deploy CLI
description: Run the repo deploy CLI (scripts/src/bin/deploy.ts) with flyctl and bun set up

inputs:
  args:
    description: Arguments passed to the deploy CLI
    required: true
  fly-api-token:
    description: Fly API token
    required: true

runs:
  using: composite
  steps:
    # Renovate bumps this exact version. flyctl's bluegreen health poll retries a
    # failed machine read on a 408, 429, 5xx or network error, but a 404 "machine
    # not found" for a just-created green machine aborts the rollout:
    # https://github.com/superfly/flyctl/blob/v0.4.116/internal/flapsutil/retry.go#L30-L52
    - name: Setup flyctl
      uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      with:
        version: 0.4.118

    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version

    - name: Install Dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Run deploy CLI
      shell: bash
      env:
        FLY_API_TOKEN: ${{ inputs.fly-api-token }}
      run: bun scripts/src/bin/deploy.ts ${{ inputs.args }}
