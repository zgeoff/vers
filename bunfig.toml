[install]
# pnpm-style symlinked node_modules — no phantom dependencies
linker = "isolated"

# bun add saves exact versions, no ^/~ ranges
exact = true

# supply-chain guard: only install versions published >= 7 days ago
minimumReleaseAge = 604800

# first-party packages skip the gate for good, and their own dependencies stay
# behind it. Renovate bumps @zgeoff packages as soon as they publish, so each one
# vers uses needs an entry here, or bun install refuses the bump.
#
# every other exclude lives only as long as its pinned version is younger than
# the gate, and needs one comment line per name in the form the audit-fix
# workflow writes. bun run deps:check fails once the date in it passes, and
# the audit-fix workflow removes an entry whose line ends "(audit-fix)".
minimumReleaseAgeExcludes = [
  "@zgeoff/agent-hooks",
  "@zgeoff/bugsink-mcp",
  "@zgeoff/bun-test-extended",
  "@zgeoff/dbhub",
  "@zgeoff/format-codemod",
  "@zgeoff/mcp-remote",
  "@zgeoff/oxlint-config",
  "@zgeoff/skill-gate",
  "@zgeoff/std",
  "@zgeoff/umami-mcp",
]

[test]
# registers jest-extended matchers for any root-invoked `bun test`; each
# bun-test package's own bunfig.toml adds its own DB-setup preload
preload = ["@zgeoff/bun-test-extended"]

