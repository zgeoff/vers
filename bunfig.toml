[install]
# pnpm-style symlinked node_modules — no phantom dependencies
linker = "isolated"

# bun add saves exact versions, no ^/~ ranges
exact = true

# supply-chain guard: only install versions published >= 7 days ago
minimumReleaseAge = 604800

# format-codemod 0.0.2 ages past the gate ~2026-07-12 — remove its exclude then (#219)
# panda 2.0 is still in beta with no stable ETA published — remove these excludes
# once @pandacss/dev goes stable (#222)
# @zgeoff/bun-test-extended 0.0.2 ages past the 7-day gate ~2026-07-11 — remove then (#257)
minimumReleaseAgeExcludes = [
  "@zgeoff/format-codemod",
  "@zgeoff/bun-test-extended",
  "@pandacss/dev",
  "@pandacss/preset-base",
  "@pandacss/preset-panda",
  "@pandacss/cli",
  "@pandacss/compiler",
  "@pandacss/config",
  "@pandacss/postcss",
  "@pandacss/types",
  "@pandacss/compiler-shared",
  "@pandacss/compiler-darwin-arm64",
  "@pandacss/compiler-darwin-x64",
  "@pandacss/compiler-linux-x64-gnu",
  "@pandacss/compiler-linux-arm64-gnu",
  "@pandacss/compiler-linux-x64-musl",
  "@pandacss/compiler-linux-arm64-musl",
  "@pandacss/compiler-win32-x64-msvc",
  "@pandacss/compiler-win32-arm64-msvc",
  "@pandacss/compiler-wasm32-wasi",
]

[test]
# registers jest-extended matchers for any root-invoked `bun test`; each
# bun-test package's own bunfig.toml adds its own DB-setup preload
preload = ["@zgeoff/bun-test-extended"]

