[install]
# pnpm-style symlinked node_modules — no phantom dependencies
linker = "isolated"

# bun add saves exact versions, no ^/~ ranges
exact = true

# supply-chain guard: only install versions published >= 7 days ago
minimumReleaseAge = 604800

# first-party packages skip the gate for good, and their own dependencies stay
# behind it. Renovate bumps @zgeoff packages as soon as they publish, so each one
# vers uses needs an entry here, or bun install refuses the bump.
#
# every other exclude lives only as long as its pinned version is younger than
# the gate — once the version ages past it, the entry is dead weight; remove it
# body-parser 1.20.9 and 2.4.0 (published 2026-10-22, patch GHSA-27r3-jxmh-p828) age past the gate ~2026-10-29 — remove then
# fast-uri 3.1.9 (published 2026-10-19, patches GHSA-w74x-v6f9-j3xg, GHSA-xhq7-xmqj-769h,
# GHSA-wjr9-j795-jxcr and GHSA-333x-w4r6-6crp) ages past the gate ~2026-10-26 — remove then
# happy-dom and @happy-dom/global-registrator 21.0.4 (published 2026-10-20, patch
# GHSA-834v-8h66-3h79) age past the gate ~2026-10-27 — remove then
minimumReleaseAgeExcludes = [
  "@happy-dom/global-registrator",
  "@zgeoff/bugsink-mcp",
  "@zgeoff/bun-test-extended",
  "@zgeoff/dbhub",
  "@zgeoff/format-codemod",
  "@zgeoff/mcp-remote",
  "@zgeoff/oxlint-config",
  "@zgeoff/skill-gate",
  "@zgeoff/std",
  "@zgeoff/umami-mcp",
  "body-parser",
  "fast-uri",
  "happy-dom",
]

[test]
# registers jest-extended matchers for any root-invoked `bun test`; each
# bun-test package's own bunfig.toml adds its own DB-setup preload
preload = ["@zgeoff/bun-test-extended"]

