[install]
# pnpm-style symlinked node_modules — no phantom dependencies
linker = "isolated"

# bun add saves exact versions, no ^/~ ranges
exact = true

# supply-chain guard: only install versions published >= 7 days ago
minimumReleaseAge = 604800

# an exclude lives only as long as its pinned version is younger than the gate —
# once the version ages past it, the entry is dead weight; remove it
# hono 4.13.0 (published 2026-08-03, patches GHSA-8j4g-w8fx-2239) ages past the gate ~2026-08-10 — remove then (#837)
# nanoid 3.3.18 (published 2026-08-07, patches the revised GHSA-2v37-7h3g-55p8) ages past the gate ~2026-08-14 — remove then (#839)
# qs 6.16.0 (published 2026-08-29, patches GHSA-x5fp-wj9c-mxmx + GHSA-4mjr-xmp4-gh2g) ages past the gate ~2026-09-05 — remove then (#982)
minimumReleaseAgeExcludes = ["hono", "nanoid", "qs"]

[test]
# registers jest-extended matchers for any root-invoked `bun test`; each
# bun-test package's own bunfig.toml adds its own DB-setup preload
preload = ["@zgeoff/bun-test-extended"]

