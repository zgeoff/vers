<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Respite viewer</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05070f;
        font-family: 'IBM Plex Mono', 'Cascadia Mono', monospace;
      }
      canvas {
        display: block;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        display: flex;
        gap: 6px;
        z-index: 10;
      }
      #hud button {
        background: rgba(10, 14, 24, 0.85);
        color: #8fa0c2;
        border: 1px solid rgba(94, 234, 212, 0.18);
        border-radius: 3px;
        font: inherit;
        font-size: 11px;
        letter-spacing: 0.08em;
        padding: 6px 10px;
        cursor: pointer;
      }
      #hud button.active {
        color: #5eead4;
        border-color: rgba(94, 234, 212, 0.6);
      }
      #assets {
        display: none;
        position: fixed;
        top: 46px;
        left: 12px;
        z-index: 10;
        max-width: 240px;
        max-height: 60vh;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #assets button {
        background: rgba(10, 14, 24, 0.85);
        color: #8fa0c2;
        border: 1px solid rgba(94, 234, 212, 0.14);
        border-radius: 3px;
        font: inherit;
        font-size: 11px;
        letter-spacing: 0.06em;
        padding: 5px 8px;
        text-align: left;
        cursor: pointer;
      }
      #assets button.active {
        color: #5eead4;
        border-color: rgba(94, 234, 212, 0.55);
      }
      #assets .asset-empty {
        background: rgba(10, 14, 24, 0.85);
        color: #6c7a99;
        border: 1px solid rgba(94, 234, 212, 0.12);
        border-radius: 3px;
        font-size: 11px;
        padding: 5px 8px;
      }
      #info {
        display: none;
        position: fixed;
        bottom: 12px;
        left: 12px;
        z-index: 10;
        background: rgba(10, 14, 24, 0.85);
        color: #8fa0c2;
        border: 1px solid rgba(94, 234, 212, 0.18);
        border-radius: 3px;
        font-size: 11px;
        letter-spacing: 0.06em;
        padding: 6px 10px;
        max-width: 80vw;
      }
      #tuner {
        display: none;
        position: fixed;
        top: 12px;
        right: 12px;
        bottom: 12px;
        width: 262px;
        overflow-y: auto;
        z-index: 10;
        background: rgba(10, 14, 24, 0.92);
        color: #8fa0c2;
        border: 1px solid rgba(94, 234, 212, 0.18);
        border-radius: 3px;
        font-size: 11px;
        letter-spacing: 0.04em;
        padding: 8px;
      }
      #tuner .tuner-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
      }
      #tuner .tuner-head button {
        background: rgba(10, 14, 24, 0.85);
        color: #5eead4;
        border: 1px solid rgba(94, 234, 212, 0.4);
        border-radius: 3px;
        font: inherit;
        font-size: 10px;
        padding: 3px 8px;
        cursor: pointer;
      }
      #tuner details {
        border-top: 1px solid rgba(94, 234, 212, 0.12);
        padding: 3px 0;
      }
      #tuner summary {
        cursor: pointer;
        color: #aab8d8;
        letter-spacing: 0.08em;
        padding: 2px 0;
        user-select: none;
      }
      #tuner .tuner-row {
        display: grid;
        grid-template-columns: 88px 1fr 54px;
        gap: 6px;
        align-items: center;
        padding: 2px 0;
      }
      #tuner .tuner-row label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #tuner input[type='range'] {
        width: 100%;
        accent-color: #5eead4;
      }
      #tuner input[type='number'] {
        width: 100%;
        background: rgba(20, 26, 42, 0.9);
        color: #cdd7ee;
        border: 1px solid rgba(94, 234, 212, 0.18);
        border-radius: 2px;
        font: inherit;
        font-size: 10px;
        padding: 2px 3px;
      }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <div id="assets"></div>
    <div id="info"></div>
    <div id="tuner"></div>
    <script type="module" src="./viewer.ts"></script>
  </body>
</html>
