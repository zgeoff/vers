# The full-stack e2e harness: the real service images the deploy pipeline is about to promote,
# postgres, and app-web's production image, wired together with the throwaway keypair in stack.env
# and a capture-only Resend stub. Image refs arrive as IMAGE_* env vars from
# `bun run deploy -- images`. Host ports: app-web 3200, postgres 5533, resend stub 3020 — off the
# dev stack's ranges so both can run beside each other.

x-service-base: &service-base
  env_file:
    - stack.env

x-service-health: &service-health
  healthcheck:
    test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health']
    interval: 2s
    timeout: 3s
    retries: 30

x-db-env: &db-env
  DATABASE_URL: postgresql://admin:password@postgres:5432/vers

services:
  postgres:
    image: postgres:16.2-alpine3.19
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=vers
    ports:
      - '5533:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d vers']
      interval: 2s
      timeout: 3s
      retries: 15
  resend-stub:
    image: oven/bun:1.3.10-slim
    # the whole workspace rides in so the stub resolves its deps from the host's installed
    # node_modules — the image itself installs nothing
    volumes:
      - ../..:/repo:ro
    working_dir: /repo
    command: ['bun', 'apps/web-e2e/src/serve-resend-stub.ts']
    ports:
      - '3020:3020'
    healthcheck:
      test: ['CMD', 'bun', '-e', 'await fetch("http://127.0.0.1:3020/health")']
      interval: 2s
      timeout: 3s
      retries: 15
  service-activity:
    image: ${IMAGE_VERS_SERVICE_ACTIVITY}
    environment: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    <<: [*service-base, *service-health]
  service-avatar:
    image: ${IMAGE_VERS_SERVICE_AVATAR}
    environment: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    <<: [*service-base, *service-health]
  service-email:
    image: ${IMAGE_VERS_SERVICE_EMAIL}
    environment:
      <<: *db-env
      EMAIL_FROM: noreply@transactional.versidle.com
      RESEND_API_KEY: stub-key
      RESEND_BASE_URL: http://resend-stub:3020
    depends_on:
      postgres:
        condition: service_healthy
      resend-stub:
        condition: service_healthy
    <<: [*service-base, *service-health]
  service-keys:
    image: ${IMAGE_VERS_SERVICE_KEYS}
    environment:
      ROLL_KEY_ROOTS: '{"trade":{"current":1,"roots":{"1":"1111111111111111111111111111111111111111111111111111111111111111"}},"self-found":{"current":1,"roots":{"1":"2222222222222222222222222222222222222222222222222222222222222222"}}}'
    <<: [*service-base, *service-health]
  service-replay:
    image: ${IMAGE_VERS_SERVICE_REPLAY}
    environment:
      <<: *db-env
      KEYS_SERVICE_URL: http://service-keys:3000
    depends_on:
      postgres:
        condition: service_healthy
      service-keys:
        condition: service_healthy
    <<: [*service-base, *service-health]
  service-session:
    image: ${IMAGE_VERS_SERVICE_SESSION}
    environment:
      <<: *db-env
      API_IDENTIFIER: http://localhost:3000/
    depends_on:
      postgres:
        condition: service_healthy
    <<: [*service-base, *service-health]
  service-user:
    image: ${IMAGE_VERS_SERVICE_USER}
    environment: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    <<: [*service-base, *service-health]
  service-verification:
    image: ${IMAGE_VERS_SERVICE_VERIFICATION}
    environment: *db-env
    depends_on:
      postgres:
        condition: service_healthy
    <<: [*service-base, *service-health]
  app-web:
    image: ${IMAGE_VERS_APP_WEB}
    environment:
      # canvas-persistence.spec.ts clicks through to the Market nav link, gated behind this flag
      FEATURE_MARKET: 'true'
      ACTIVITY_SERVICE_URL: http://service-activity:3000
      AVATAR_SERVICE_URL: http://service-avatar:3000
      EMAIL_SERVICE_URL: http://service-email:3000
      KEYS_SERVICE_URL: http://service-keys:3000
      REPLAY_SERVICE_URL: http://service-replay:3000
      SESSION_SERVICE_URL: http://service-session:3000
      USER_SERVICE_URL: http://service-user:3000
      VERIFICATION_SERVICE_URL: http://service-verification:3000
      SESSION_SECRET: e2e-session-secret-32-characters
    ports:
      - '3200:3000'
    depends_on:
      service-activity:
        condition: service_healthy
      service-avatar:
        condition: service_healthy
      service-email:
        condition: service_healthy
      service-keys:
        condition: service_healthy
      service-replay:
        condition: service_healthy
      service-session:
        condition: service_healthy
      service-user:
        condition: service_healthy
      service-verification:
        condition: service_healthy
    env_file:
      - stack.env
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/health']
      interval: 2s
      timeout: 3s
      retries: 30
