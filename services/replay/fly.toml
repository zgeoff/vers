# Private backend service: reachable only over the org's 6PN WireGuard mesh via
# `vers-service-replay.flycast`. No public IP is allocated (see the deploy runbook),
# so `force_https` stays off — internal mesh traffic is already encrypted.
app = 'vers-service-replay'
primary_region = 'syd'

[build]

[http_service]
internal_port = 3000
force_https = false
auto_stop_machines = 'suspend'
auto_start_machines = true
# The replay worker is a DB poll loop with no inbound traffic in normal play — a
# suspended machine never wakes on its own, so one machine stays running to keep
# verification and the lag gauge's exporter alive.
min_machines_running = 1
processes = ['app']

[http_service.concurrency]
type = 'requests'
soft_limit = 200
hard_limit = 250

[[http_service.checks]]
method = 'GET'
path = '/health'
interval = '15s'
timeout = '2s'
grace_period = '10s'

[env]
KEYS_SERVICE_URL = 'http://vers-service-keys.flycast'

[[vm]]
memory = '256mb'
cpu_kind = 'shared'
cpus = 1

[deploy]
strategy = 'rolling'
max_unavailable = 1
