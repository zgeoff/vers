# Private backend service: reachable only over the org's 6PN WireGuard mesh via
# `vers-service-verification.flycast`. No public IP is allocated (see the deploy runbook),
# so `force_https` stays off — internal mesh traffic is already encrypted.
app = 'vers-service-verification'
primary_region = 'syd'

[build]

[http_service]
internal_port = 3000
force_https = false
auto_stop_machines = 'suspend'
auto_start_machines = true
min_machines_running = 0
processes = ['app']

[http_service.concurrency]
type = 'requests'
soft_limit = 200
hard_limit = 250

[[http_service.checks]]
method = 'GET'
path = '/health'
interval = '15s'
timeout = '2s'
grace_period = '10s'

[[vm]]
memory = '256mb'
cpu_kind = 'shared'
cpus = 1

[deploy]
strategy = 'bluegreen'
