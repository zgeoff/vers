services:
  postgres:
    image: postgres:16.2-alpine3.19
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=vers
      - PGPORT=5433
    volumes:
      - postgres:/var/lib/postgresql/data
    expose:
      - '5433'
    ports:
      - '5433:5433'
  service-avatar:
    build:
      context: .
      dockerfile: services/avatar/Dockerfile
      args:
        BUILD_MODE: development
    env_file:
      - services/avatar/.env.development
    environment:
      - DATABASE_URL=postgresql://admin:password@postgres:5433/vers
    ports:
      - '3005:3005'
    depends_on:
      - postgres
  service-session:
    build:
      context: .
      dockerfile: services/session/Dockerfile
      args:
        BUILD_MODE: development
    env_file:
      - services/session/.env.development
    environment:
      - DATABASE_URL=postgresql://admin:password@postgres:5433/vers
    ports:
      - '3002:3002'
    depends_on:
      - postgres
  service-user:
    build:
      context: .
      dockerfile: services/user/Dockerfile
      args:
        BUILD_MODE: development
    env_file:
      - services/user/.env.development
    environment:
      - DATABASE_URL=postgresql://admin:password@postgres:5433/vers
    ports:
      - '3003:3003'
    depends_on:
      - postgres
  service-verification:
    build:
      context: .
      dockerfile: services/verification/Dockerfile
      args:
        BUILD_MODE: development
    env_file:
      - services/verification/.env.development
    environment:
      - DATABASE_URL=postgresql://admin:password@postgres:5433/vers
    ports:
      - '3004:3004'
    depends_on:
      - postgres
volumes:
  postgres:
