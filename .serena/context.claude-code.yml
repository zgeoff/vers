description:
  Claude Code for the vers monorepo. Symbol tools only; retrieval policy lives in the repo's
  AGENTS.md and hooks.
prompt: |
  You are running in Claude Code. File reads, content search, line-based edits and shell
  commands are handled by your built-in tools.
  Serena adds language-server symbol tools: file overview, definition, references,
  diagnostics, and symbol-level edits. They may be deferred; load a tool's schema with
  tool search before its first use.
  Which tool family to prefer in a given phase of work is set by the project's AGENTS.md
  and hooks, not by this prompt.

excluded_tools:
  - create_text_file
  - read_file
  - execute_shell_command
  - find_file
  - list_dir
  - search_for_pattern
  - replace_content
  - replace_in_files
  - get_current_config
  - open_dashboard

tool_description_overrides: {}

single_project: true

# Claude Code does not unpack structured tool output; keep this off.
structured_tool_output: false
