description:
  Claude Code for the vers monorepo, served by one shared read-only daemon. Symbol lookups only;
  retrieval policy lives in the repo's AGENTS.md and hooks.
prompt: |
  You are running in Claude Code. File reads, content search, edits and shell commands are
  handled by your built-in tools.
  Serena adds read-only language-server symbol tools: file overview, definition, references,
  implementations, and diagnostics. They may be deferred; load a tool's schema with tool search
  before its first use.
  Serena indexes the primary checkout, not your worktree: a symbol your branch adds or renames is
  invisible to it until the branch merges, so fall back to content search for those.
  Which tool family to prefer in a given phase of work is set by the project's AGENTS.md and
  hooks, not by this prompt.
excluded_tools:
  - create_text_file
  - read_file
  - execute_shell_command
  - find_file
  - list_dir
  - search_for_pattern
  - replace_content
  - replace_in_files
  - replace_symbol_body
  - insert_after_symbol
  - insert_before_symbol
  - rename_symbol
  - safe_delete_symbol
  - get_current_config
  - open_dashboard
tool_description_overrides: {}
single_project: true
structured_tool_output: false
