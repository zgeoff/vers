# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
language: en-US

reviews:
  profile: assertive
  high_level_summary: false
  collapse_walkthrough: true
  sequence_diagrams: false
  path_filters:
    - '!bun.lock'
    - '!libs/data/db/src/schema.generated.ts'
  path_instructions:
    - path: '**/*.ts'
      instructions: |
        tiny-invariant guards conditions only a bug can break. Values originating
        inside the system — pinned snapshots, replay-verified trajectory facts,
        server-minted secrets, table content the repo ships — are that territory,
        and invariant() is correct for them. Suggest ordinary control flow only
        for genuinely external input: request payloads, user-entered data.
        Do not propose validation guards for values that are not caller
        input — module-level constants, literals, compile-time-fixed
        config. A guard against input that cannot occur is dead code,
        not robustness.
    - path: '**/*.test.ts'
      instructions: |
        Test data comes in two kinds with different rules:
        - Domain objects and DTOs come from the package's faker-defaulted
          create-mock-* factories (test-utils/factories/) in every package
          kind, pure libraries included. Never flag factory use as a
          violation of the pure-package "mock-free" rule — that rule bans
          test doubles (stubs, spies, module mocks), not data factories.
        - Plain arguments, options bags, and config values are written
          inline at the call site, even when repeated across tests. Do not
          suggest extracting them into shared fixtures, baseline helpers,
          or factories.
        Golden and frozen-contract tests hardcode literals deliberately
        (domain labels, canonical encodings, expected draw values). Never
        suggest replacing such a literal with an import of the constant it
        verifies — if the constant changes, the test must fail.
        expect(...).rejects/.resolves assertion chains are deliberately not
        awaited: Bun's matcher types declare them synchronous, per the AGENTS.md
        testing rules. Only toResolve()/toReject() return promises and are
        awaited. Never flag an unawaited .rejects/.resolves chain.
    - path: 'AGENTS.md'
      instructions: |
        AGENTS.md is generated from agents/shared.md and agents/project.md and
        committed alongside them; a PR editing a partial plus the regenerated
        AGENTS.md is correct. Flag only an AGENTS.md change with no corresponding
        partial change — and CI's drift check already catches stale regeneration.
  auto_review:
    enabled: true
    auto_incremental_review: false
    drafts: false
  tools:
    eslint:
      enabled: false
    biome:
      enabled: false

knowledge_base:
  learnings:
    scope: local

chat:
  art: false
